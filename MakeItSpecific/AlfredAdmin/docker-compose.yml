# AlfredAdmin — Alfred 管理后台
# 启动: docker compose up -d
# 依赖: ../.env 中的 PGSQLPASSWORD + 各 LLM API Key

services:
  alfred-admin:
    build: .
    container_name: alfred-admin
    expose:
      - "8080"
    environment:
      - ADMIN_PORT=8080
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in root .env}
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD:?set ADMIN_INIT_PASSWORD in root .env}
      - DATABASE_URL=postgres://postgres:${PGSQLPASSWORD}@postgres:5432/alfred?sslmode=disable
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
