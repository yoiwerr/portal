<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Journal</title>
  <link rel="stylesheet" href="/journal/assets/journal.css?v=20260827">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/journal/" aria-label="Journal 时间线">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span>Journal</span>
      </a>

      <nav class="sidebar-nav" aria-label="日志导航">
        <a class="nav-item active" href="#timeline">
          <span>时间线</span>
          <span class="nav-count" id="sidebarEntryCount"></span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a class="sidebar-link" href="/">返回 Portal</a>
        <button class="sidebar-link" id="logoutButton" type="button">退出登录</button>
      </div>
    </aside>

    <main class="timeline-main" id="timeline">
      <header class="mobile-header">
        <a class="brand" href="/journal/">
          <span class="brand-mark" aria-hidden="true">J</span>
          <span>Journal</span>
        </a>
        <button class="plain-button" id="mobileLogoutButton" type="button">退出</button>
      </header>

      <section class="timeline-heading" aria-labelledby="page-title">
        <div>
          <p class="today-label" id="todayLabel"></p>
          <h1 id="page-title">时间线</h1>
        </div>
        <div class="timeline-tools">
          <label class="visually-hidden" for="searchInput">搜索日志</label>
          <input id="searchInput" type="search" placeholder="搜索日志" autocomplete="off">
          <p class="entry-count" id="entryCount" aria-live="polite"></p>
        </div>
      </section>

      <section class="composer" aria-labelledby="composerTitle">
        <form id="entryForm">
          <input id="entryId" type="hidden">
          <div class="composer-mark" aria-hidden="true">J</div>
          <div class="composer-fields">
            <h2 class="visually-hidden" id="composerTitle">写日志</h2>
            <label class="visually-hidden" for="entryTitle">标题</label>
            <input id="entryTitle" name="title" type="text" maxlength="120" placeholder="标题（可选）">

            <label class="visually-hidden" for="entryContent">内容</label>
            <textarea id="entryContent" name="content" rows="5" maxlength="100000" placeholder="记录此刻..." required></textarea>

            <p class="form-error" id="entryError" role="alert" aria-live="polite"></p>
            <div class="composer-footer">
              <p class="edit-state" id="editState" hidden>正在编辑日志</p>
              <div class="composer-actions">
                <button class="plain-button" id="cancelEntryButton" type="button" hidden>取消</button>
                <button class="primary-button" type="submit">发布</button>
              </div>
            </div>
          </div>
        </form>
      </section>

      <section class="feed" id="entryFeed" aria-label="日志时间线" aria-live="polite">
        <p class="loading-state" id="loadingState">正在读取...</p>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/journal/assets/journal.js?v=20260827" defer></script>
</body>
</html>
