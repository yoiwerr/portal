<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Journal</title>
  <link rel="stylesheet" href="/journal/assets/journal.css?v=20260827f">
</head>
<body class="app-body">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/journal/" aria-label="Journal 首页">
        <span>Journal</span>
      </a>
      <div class="topbar-actions">
        <a class="quiet-link" href="/">Portal</a>
        <button class="quiet-button" id="logoutButton" type="button">退出</button>
      </div>
    </div>
  </header>

  <main class="feed-shell">
    <section class="feed-intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">我的动态</h1>
      </div>
      <p class="entry-count" id="entryCount" aria-live="polite"></p>
    </section>

    <section class="composer" aria-labelledby="composerTitle">
      <div class="avatar" aria-hidden="true">
        <img src="/journal/assets/avatar.jpg" alt="">
      </div>
      <form id="entryForm">
        <h2 class="visually-hidden" id="composerTitle">发布动态</h2>
        <input id="entryId" type="hidden">

        <label class="visually-hidden" for="entryContent">动态内容</label>
        <textarea id="entryContent" name="content" rows="2" maxlength="100000" placeholder="记录这一刻..." required></textarea>

        <label class="visually-hidden" for="entryTitle">标题</label>
        <input id="entryTitle" name="title" type="text" maxlength="120" placeholder="添加标题（可选）">

        <div class="composer-preview" id="imagePreview" hidden></div>
        <div class="composer-media-row">
          <label class="image-picker" for="entryImages">添加图片</label>
          <input id="entryImages" name="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
          <span class="image-count" id="imageCount" aria-live="polite"></span>
        </div>

        <p class="form-error" id="entryError" role="alert" aria-live="polite"></p>
        <div class="composer-footer">
          <p class="edit-state" id="editState" hidden>正在编辑</p>
          <div class="composer-actions">
            <button class="quiet-button" id="cancelEntryButton" type="button" hidden>取消</button>
            <button class="publish-button" type="submit">发布</button>
          </div>
        </div>
      </form>
    </section>

    <section class="feed-controls" aria-label="动态筛选">
      <label class="visually-hidden" for="searchInput">搜索动态</label>
      <input id="searchInput" type="search" placeholder="搜索我的动态" autocomplete="off">
    </section>

    <section class="feed" id="entryFeed" aria-label="我的动态" aria-live="polite">
      <p class="loading-state" id="loadingState">正在读取...</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/journal/assets/journal.js?v=20260827e" defer></script>
</body>
</html>
