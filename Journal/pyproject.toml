[project]
name = "portal-journal"
version = "0.1.0"
description = "Private single-user journal for Portal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1,<0.117",
    "uvicorn[standard]>=0.35,<0.36",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "argon2-cffi>=23.1,<26",
    "python-multipart>=0.0.20,<0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8.3,<9",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
