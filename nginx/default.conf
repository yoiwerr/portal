resolver 127.0.0.11 valid=10s ipv6=off;
limit_req_zone $binary_remote_addr zone=journal_login:10m rate=5r/m;

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name yoiwerr.site www.yoiwerr.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yoiwerr.site www.yoiwerr.site;

    ssl_certificate     /etc/letsencrypt/live/yoiwerr.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoiwerr.site/privkey.pem;

    # SSL 加固
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/event-stream;
    gzip_min_length 256;
    gzip_vary on;

    client_max_body_size 50m;

    # 自定义错误页
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Portal Homepage ──────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Portal static assets
    location /css/   { root /usr/share/nginx/html; expires 7d; }
    location /js/    { root /usr/share/nginx/html; expires 7d; }
    location /bgm/   { root /usr/share/nginx/html; expires 1d; }
    location /photo/ { root /usr/share/nginx/html; expires 7d; }

    # Private Journal
    location = /journal {
        return 301 /journal/;
    }

    location = /journal/api/login {
        limit_req zone=journal_login burst=3 nodelay;
        proxy_pass http://journal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /journal/ {
        client_max_body_size 80m;
        set $upstream journal:8000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Retired ChatLab URLs cannot fall through to static files or upstreams.
    location /chatlab { return 410; }
    location = /css/chatlab.css { return 410; }
    location = /js/chatlab.js { return 410; }

    # The former root API belonged to ChatLab. dude uses /dude/api/.
    location /api {
        return 410;
    }

    # ── dude — Admin (Go) ──────────
    location = /alfred { return 308 /dude/$is_args$args; }
    location = /alfred/auth { return 308 /dude/auth/$is_args$args; }
    location = /alfred/admin { return 308 /dude/admin/$is_args$args; }
    location = /dude { return 301 /dude/; }
    location = /dude/auth { return 301 /dude/auth/; }
    location = /dude/admin { return 301 /dude/admin/; }

    # Canonical /api/v1/ and legacy API URLs both reach Go. With a variable
    # upstream, a URI in proxy_pass replaces the whole path (losing login,
    # me, filenames, etc.). Rewrite first, then pass the complete URI.
    location ~ ^/(?:dude|alfred)/(?:api/(?:v1/)?(?:auth|admin)/|(?:auth|admin)/) {
        set $admin_upstream dude-admin:8080;
        rewrite ^/(?:dude|alfred)/(auth|admin)/static/(.*)$ /static/$2 break;
        rewrite ^/(?:dude|alfred)/api/(?:v1/)?(auth|admin)/(.*)$ /api/v1/$1/$2 break;
        rewrite ^/(?:dude|alfred)/(auth|admin)/(.*)$ /$1/$2 break;
        proxy_pass http://$admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ── dude — AI Engine (Python) ──────
    location /dude/ {
        proxy_pass http://dude-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Legacy routes preserve methods, bodies and query strings.
    location /alfred/ {
        proxy_pass http://dude-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
